<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Banking System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏦 Mini Banking System</h1>
        <p class="subtitle">
            Create accounts, deposit, withdraw, transfer money and view transactions.
        </p>

        <!-- Create Account -->
        <div class="card">
            <h2>Create Account</h2>

            <input
                type="text"
                id="holderName"
                placeholder="Enter account holder name"
            >

            <input
                type="number"
                id="initialBalance"
                placeholder="Enter initial balance"
            >

            <button id="createAccountBtn">Create Account</button>
        </div>


        <!-- Deposit -->
        <div class="card">
            <h2>Deposit Money</h2>

            <input
                type="number"
                id="depositAccountNo"
                placeholder="Account number"
            >

            <input
                type="number"
                id="depositAmount"
                placeholder="Amount"
            >

            <button id="depositBtn">Deposit</button>
        </div>


        <!-- Withdraw -->
        <div class="card">
            <h2>Withdraw Money</h2>

            <input
                type="number"
                id="withdrawAccountNo"
                placeholder="Account number"
            >

            <input
                type="number"
                id="withdrawAmount"
                placeholder="Amount"
            >

            <button id="withdrawBtn">Withdraw</button>
        </div>


        <!-- Transfer -->
        <div class="card">
            <h2>Transfer Money</h2>

            <input
                type="number"
                id="fromAccountNo"
                placeholder="From account number"
            >

            <input
                type="number"
                id="toAccountNo"
                placeholder="To account number"
            >

            <input
                type="number"
                id="transferAmount"
                placeholder="Amount"
            >

            <button id="transferBtn">Transfer</button>
        </div>


        <!-- Check Balance -->
        <div class="card">
            <h2>Check Balance</h2>

            <input
                type="number"
                id="balanceAccountNo"
                placeholder="Account number"
            >

            <button id="checkBalanceBtn">Check Balance</button>

            <p id="balanceResult"></p>
        </div>


        <!-- Transaction History -->
        <div class="card">
            <h2>Transaction History</h2>

            <input
                type="number"
                id="transactionAccountNo"
                placeholder="Account number"
            >

            <button id="transactionBtn">Show Transactions</button>

            <div id="transactionResult"></div>
        </div>


        <!-- All Accounts -->
        <div class="card">
            <h2>All Accounts</h2>

            <button id="showAccountsBtn">Show All Accounts</button>

            <div id="accountsResult"></div>
        </div>


        <!-- Message -->
        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
